# Illustrative manifest ONLY. SpareCore never automatically installs this.
# Change edge-worker-01 and the example ServiceAccount name for YOUR cluster.
# Follow your normal GitOps review and independent RBAC validation.
# Never copy privileged Kubernetes credentials to a personal device.
apiVersion: v1
kind: Namespace
metadata:
  name: sparecore-system
  labels:
    app.kubernetes.io/part-of: sparecore
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-worker-admission
  namespace: sparecore-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sparecore-edge-worker-admission
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["edge-worker-01"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sparecore-edge-worker-admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sparecore-edge-worker-admission
subjects:
  - kind: ServiceAccount
    name: edge-worker-admission
    namespace: sparecore-system
