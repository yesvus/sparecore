name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sparecore
      - run: python -m py_compile scripts/check-zombie-drain.py
      - run: python -m py_compile scripts/fence-zombie.py
      - run: bash -n scripts/smoke-orbstack.sh
      - run: bash -n scripts/enroll-guest-tailscale.sh
      - run: bash -n scripts/enroll-lima-tailscale.sh
